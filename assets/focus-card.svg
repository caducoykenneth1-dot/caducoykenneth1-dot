<svg width="720" height="120" viewBox="0 0 720 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Currently building">
  <rect x="0" y="0" width="720" height="120" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>

  <!-- pixel corner accents -->
  <rect x="4" y="4" width="6" height="6" fill="#58a6ff"/>
  <rect x="710" y="4" width="6" height="6" fill="#58a6ff"/>
  <rect x="4" y="110" width="6" height="6" fill="#58a6ff"/>
  <rect x="710" y="110" width="6" height="6" fill="#58a6ff"/>

  <text x="28" y="42" fill="#c9d1d9" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="1">CURRENTLY_BUILDING</text>

  <!-- blinking pixel cursor -->
  <rect x="242" y="30" width="8" height="14" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="28" y="68" fill="#7d8590" font-family="Consolas, Menlo, monospace" font-size="12">Modern products, calm interfaces, strong foundations.</text>

  <!-- pixel progress bar -->
  <g>
    <rect x="28" y="86" width="8" height="8" fill="#58a6ff"/>
    <rect x="40" y="86" width="8" height="8" fill="#58a6ff"/>
    <rect x="52" y="86" width="8" height="8" fill="#58a6ff"/>
    <rect x="64" y="86" width="8" height="8" fill="#58a6ff"/>
    <rect x="76" y="86" width="8" height="8" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="88" y="86" width="8" height="8" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="86" width="8" height="8" fill="#21262d"/>
    <rect x="112" y="86" width="8" height="8" fill="#21262d"/>
    <rect x="124" y="86" width="8" height="8" fill="#21262d"/>
    <rect x="136" y="86" width="8" height="8" fill="#21262d"/>
  </g>

  <text x="656" y="42" fill="#7d8590" font-family="Consolas, Menlo, monospace" font-size="11" text-anchor="end">v1.0</text>
</svg>
